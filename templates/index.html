<!DOCTYPE html>
<html>
<head>
    <title>Profile Recommendation</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center text-primary">Profile Recommendation System</h1>

        <!-- File Upload Form -->
        <div class="card p-4 shadow-lg mb-4">
            <h4>Upload CSV File</h4>
            <form action="/" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" class="form-control mb-2">
                <button type="submit" class="btn btn-success">Upload</button>
            </form>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-info mt-3">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
        </div>

        <!-- Filter Form -->
        <div class="card p-4 shadow-lg">
            <form action="/results" method="POST">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Min Age:</label>
                        <input type="number" class="form-control" name="min_age" min="{{ age_min }}" max="{{ age_max }}" placeholder="Min Age">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Max Age:</label>
                        <input type="number" class="form-control" name="max_age" min="{{ age_min }}" max="{{ age_max }}" placeholder="Max Age">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Gender:</label>
                        <select class="form-select" name="gender">
                            <option value="">All</option>
                            {% for gender in gender_options %}
                                <option value="{{ gender }}">{{ gender }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Country:</label>
                        <select class="form-select" name="country">
                            <option value="">All</option>
                            {% for country in country_options %}
                                <option value="{{ country }}">{{ country }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Gotra:</label>
                        <select class="form-select" name="gotra">
                            <option value="">All</option>
                            {% for gotra in gotra_options %}
                                <option value="{{ gotra }}">{{ gotra }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
